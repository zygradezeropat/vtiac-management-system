<div id="enrollment-step-9" class="student-enroll-wizard-step hidden-step" data-enrollment-step="9" data-step-title="Privacy Consent and Disclaimer">
  <section class="student-panel student-enroll-card">
    <h3 class="student-enroll-section__title">9. Privacy Consent and Disclaimer</h3>
    <div class="student-enroll-consent">
      <div class="form-check student-enroll-check mb-0">
        <input class="form-check-input" type="checkbox" name="privacy_consent" id="field-privacy" value="1" required data-required{% if fi.privacy_consent %} checked{% endif %} />
        <label class="form-check-label" for="field-privacy">
          I agree to allow TESDA to use/post my contact details and other information I provided for scholarship processing, employment opportunities, and related purposes per TESDA data privacy policy. <span class="student-enroll-required">*</span>
        </label>
      </div>
    </div>
  </section>
</div>
