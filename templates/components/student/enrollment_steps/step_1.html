<div id="enrollment-step-1" class="student-enroll-wizard-step" data-enrollment-step="1" data-step-title="T2MIS Auto Generated">
  <section class="student-panel student-enroll-card">
    <h3 class="student-enroll-section__title">1. T2MIS Auto Generated</h3>
    <div class="row g-3">
      <div class="col-md-4">
        <label class="student-enroll-label" for="field-tsmis">TSMIS</label>
        <input id="field-tsmis" name="tsmis" type="text" class="student-enroll-input" value="{{ tsmis_display }}" readonly />
        <span class="student-enroll-hint">Auto-generated</span>
      </div>
      <div class="col-md-4">
       
          <label class="student-enroll-label fw-bold text-dark" for="field-uli">
            <i class="bi bi-info-circle-fill text-warning me-1"></i> Unique Learner Identifier
          </label>
          <input id="field-uli" name="uli" type="text" class="student-enroll-input bg-white" placeholder="Enter ULI if available" value="{{ fi.uli|default:'' }}" />
          <div class="form-text text-danger fw-semibold mt-1" style="font-size: 0.8rem;">
            * To be filled in by the registrar
          </div>
          
      </div>
      <div class="col-md-4">
        <label class="student-enroll-label" for="field-entry-date">Entry Date (MM/DD/YY)</label>
        <input id="field-entry-date" name="entry_date" type="text" class="student-enroll-input" value="{{ entry_date_display }}" readonly />
      </div>
    </div>
  </section>
</div>
